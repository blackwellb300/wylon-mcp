[project]
name = "wylon-mcp"
version = "0.1.0"
description = "MCP server for wylon Token Factory image & video generation (Qwen-Image, MiniMax-H3)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "wylon" }]
keywords = ["mcp", "wylon", "text-to-image", "text-to-video", "minimax", "qwen-image"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.12,<2",
    "pillow>=10",
]

[project.urls]
Homepage = "https://wylon.cn"

[project.scripts]
wylon-mcp = "wylon_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wylon_mcp"]
